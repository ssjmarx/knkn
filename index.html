<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>KON KON</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #1a1a1a;
        height: 100%;
        touch-action: none;
        overscroll-behavior: none;
        overflow: hidden;
      }
      #shell {
        height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
      }
      #screen {
        width: min(100vw, 80dvh);
        aspect-ratio: 1 / 1;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      canvas {
        image-rendering: pixelated;
      }
      #controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: min(100vw, 480px);
        padding: 12px;
        box-sizing: border-box;
      }
      #dpad {
        display: grid;
        grid-template-areas:
          ". up ."
          "left . right"
          ". down .";
        gap: 4px;
      }
      #dpad button[data-dir="up"] { grid-area: up }
      #dpad button[data-dir="down"] { grid-area: down }
      #dpad button[data-dir="left"] { grid-area: left }
      #dpad button[data-dir="right"] { grid-area: right }
      #face {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      button {
        width: 56px;
        height: 56px;
        font-size: 24px;
        color: #ddd;
        background: #2a2a2a;
        border: 2px solid #444;
        border-radius: 12px;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      button.pressed {
        background: #4a4a4a;
        border-color: #999;
        transform: scale(0.94);
      }
      @media (orientation: landscape) and (pointer: coarse) {
        #screen {
          width: auto;
          height: 100dvh;
          margin: 0 auto;
        }
        #controls {
          position: fixed;
          inset: 0;
          pointer-events: none;
          justify-content: space-between;
          padding: 0 24px;
          width: auto;
          max-width: none;
        }
        #controls button {
          pointer-events: auto;
        }
      }
    </style>
  </head>
  <body>
    <div id="shell">
      <div id="screen"><div id="game"></div></div>
      <div id="controls">
        <div id="dpad">
          <button data-dir="up">▲</button>
          <button data-dir="left">◀</button>
          <button data-dir="right">▶</button>
          <button data-dir="down">▼</button>
        </div>
        <div id="face">
          <button data-action="confirm">A</button>
          <button data-action="cancel">B</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
